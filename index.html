<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>동네전쟁 지도 시안</title>
<link rel="stylesheet" href="style.css?v=17"></head><body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="top">
    <div class="glass season"><b>동네<em>전쟁</em></b><small>SEASON 1 · WEEK 1</small></div>
    <div class="glass crumbs" id="crumb"></div>
    <div class="sp"></div>
    <div class="glass chip"><svg viewBox="0 0 24 24" fill="none" stroke="#6fe3ff" stroke-width="2"><path d="M5 21V4h12l-2 4 2 4H5"/></svg><div><div class="k">수복 지역</div><div class="v" id="sOpen">2/16</div></div></div>
    <div class="glass chip"><svg viewBox="0 0 24 24" fill="none" stroke="#f0c46a" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 0 1 0 7M19 20c0-3-1-4.5-3-5.5"/></svg><div><div class="k">인구 (DEMO)</div><div class="v"><span id="sPop">0</span><span class="d">▲ 300</span></div></div></div>
    <div class="glass chip opt"><svg viewBox="0 0 24 24" fill="none" stroke="#7dffb2" stroke-width="2"><path d="M3 20h18M5 20V9l7-5 7 5v11M10 20v-6h4v6"/></svg><div><div class="k">건물 (DEMO)</div><div class="v" id="sBld">0</div></div></div>
  </div>
  <div class="glass" id="side"></div>
  <div class="glass" id="mini"><div class="t">MINIMAP</div><canvas id="mc"></canvas></div>
  <div class="glass" id="ticker"><b><span class="dot"></span>LIVE</b><span id="tk">AI 신호 감지: 충청권 경계에서 이상 활동. 수복 지역은 방어 태세를 유지합니다.</span></div>
  <button id="act"><div><small>다음 수복 작전</small>신청 게시글 열기</div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1405" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <div class="glass" id="toast"></div>
</div>
<div id="title">
  <div class="bg" id="tbg"></div><div class="mist m1"></div><div class="mist m2"></div><div class="sweep"></div><div class="vig"></div>
  <div class="logo"><h1>동네<em>전쟁</em></h1><p>AI와의 전쟁 이후, 수복된 땅</p></div>
  <div class="start"><button class="btn" id="startBtn">게임 시작</button><div class="hintt">화면을 눌러 시작</div></div>
  <div class="ver">SEASON 1 · DEMO</div>
</div>
<script src="app.js?v=17"></script>
<script src="terrain.js?v=17"></script>
<script src="landmarks.js?v=17"></script>
<script src="card.js?v=17"></script>
</body></html>
