<!doctype html>
<meta charset="utf-8">
<title>landmark key</title>
<!-- 마젠타 배경 제거 + 두 상태 분리. tools/process_landmarks.py 가 헤드리스 Chrome으로 이 페이지를 열어 결과를 가져간다. -->
<script>
const params = new URLSearchParams(location.search);
const SRC = params.get('src');
const MAX_H = +(params.get('maxh') || 640), MAX_W = +(params.get('maxw') || 900), PAD = 6;

function load(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('load ' + src)); im.src = src; });
}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };

// 마젠타 정도 k: 1에 가까울수록 마젠타. 빨강(안테나)·분홍(벚꽃)·흰색은 낮게 나온다.
function magentaK(d, n) {
  const k = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2], mn = Math.min(r, b);
    k[i] = mn > 30 ? (mn - g) / mn : -1;
  }
  return k;
}

function key(img) {
  const W = img.naturalWidth, H = img.naturalHeight, N = W * H;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0);
  const im = x.getImageData(0, 0, W, H), d = im.data, k = magentaK(d, N);
  const bg = new Uint8Array(N); // 1 = 배경(투명)
  const stack = new Int32Array(N);

  // 1) 테두리에서 이어진 마젠타 영역을 채운다(건물 안쪽의 붉은색·분홍색은 건드리지 않음)
  let sp = 0;
  const push = i => { if (!bg[i] && k[i] > 0.3) { bg[i] = 1; stack[sp++] = i; } };
  for (let xx = 0; xx < W; xx++) { push(xx); push((H - 1) * W + xx); }
  for (let yy = 0; yy < H; yy++) { push(yy * W); push(yy * W + W - 1); }
  const flood = () => {
    while (sp) {
      const i = stack[--sp], px = i % W, py = (i - px) / W;
      if (px > 0) push(i - 1); if (px < W - 1) push(i + 1); if (py > 0) push(i - W); if (py < H - 1) push(i + W);
    }
  };
  flood();

  // 2) 건물 사이에 갇힌 진한 마젠타 덩어리(큰 것만)도 배경으로
  const seen = new Uint8Array(N);
  for (let s = 0; s < N; s++) {
    if (bg[s] || seen[s] || k[s] <= 0.72) continue;
    const comp = []; let q = [s]; seen[s] = 1;
    while (q.length) {
      const i = q.pop(); comp.push(i);
      const px = i % W, py = (i - px) / W;
      const nb = [px > 0 ? i - 1 : -1, px < W - 1 ? i + 1 : -1, py > 0 ? i - W : -1, py < H - 1 ? i + W : -1];
      for (const j of nb) if (j >= 0 && !seen[j] && !bg[j] && k[j] > 0.72) { seen[j] = 1; q.push(j); }
    }
    if (comp.length >= 3) for (const i of comp) bg[i] = 1;   // 안테나 격자 사이 같은 작은 구멍도 배경
  }
  // 갇힌 덩어리의 가장자리(0.3<k<=0.6)까지 번지게
  sp = 0; for (let i = 0; i < N; i++) if (bg[i]) stack[sp++] = i;
  const grow = new Uint8Array(bg); // 이미 배경인 픽셀에서 k>0.3 이웃으로 확장
  while (sp) {
    const i = stack[--sp], px = i % W, py = (i - px) / W;
    const tryj = j => { if (!grow[j] && k[j] > 0.3) { grow[j] = 1; bg[j] = 1; stack[sp++] = j; } };
    if (px > 0) tryj(i - 1); if (px < W - 1) tryj(i + 1); if (py > 0) tryj(i - W); if (py < H - 1) tryj(i + W);
  }

  // 3) 배경과 맞닿은 3픽셀 띠: 부드러운 알파 + 마젠타 성분 제거(디스필)
  const dist = new Int8Array(N).fill(-1); let q = [];
  for (let i = 0; i < N; i++) if (bg[i]) { dist[i] = 0; q.push(i); }
  for (let depth = 1; depth <= 3; depth++) {
    const nq = [];
    for (const i of q) {
      const px = i % W, py = (i - px) / W;
      for (const j of [px > 0 ? i - 1 : -1, px < W - 1 ? i + 1 : -1, py > 0 ? i - W : -1, py < H - 1 ? i + W : -1])
        if (j >= 0 && dist[j] < 0) { dist[j] = depth; nq.push(j); }
    }
    q = nq;
  }
  const out = new Uint8ClampedArray(N * 4);
  for (let i = 0; i < N; i++) {
    let r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2], a = 255;
    if (bg[i]) a = 0;
    else if (dist[i] > 0) {
      const f = smooth(0.12, 0.7, k[i]);          // 마젠타가 섞인 비율 추정
      if (f > 0) {
        const al = 1 - f;
        a = Math.round(255 * al);
        if (al > 0.04) {
          r = Math.min(255, Math.max(0, (r - f * 255) / al));
          b = Math.min(255, Math.max(0, (b - f * 255) / al));
        }
        const spill = Math.max(0, Math.min(r, b) - g);   // 남은 분홍기 제거
        r -= spill * 0.8; b -= spill * 0.8;
      }
    }
    if (a > 0 && k[i] > 0.45) {                      // 안쪽에 남은 분홍/보라 번짐을 줄인다
      const sp2 = Math.max(0, Math.min(r, b) - g) * smooth(0.45, 0.7, k[i]);
      r -= sp2 * 0.75; b -= sp2 * 0.75;
    }
    out[i * 4] = r; out[i * 4 + 1] = g; out[i * 4 + 2] = b; out[i * 4 + 3] = a;
  }
  return { W, H, data: out };
}

// 가운데 근처에서 비어 있는 열(두 건물 사이)을 찾아 분리 위치를 정한다
function findSplit(W, H, data) {
  const col = new Int32Array(W);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (data[(y * W + x) * 4 + 3] > 64) col[x]++;
  const lo = Math.floor(W * 0.3), hi = Math.floor(W * 0.7);
  let best = null, run = 0, start = lo;
  for (let x = lo; x <= hi; x++) {
    if (col[x] <= 2) { if (!run) start = x; run++; if (!best || run > best.len) best = { len: run, mid: start + (run >> 1) }; }
    else run = 0;
  }
  if (best) return { x: best.mid, empty: true, len: best.len };
  let mx = lo; for (let x = lo; x <= hi; x++) if (col[x] < col[mx]) mx = x;
  return { x: mx, empty: false, len: 0, count: col[mx] };
}

function crop(W, H, data, x0, x1) {
  let minX = x1, maxX = x0, minY = H, maxY = 0;
  for (let y = 0; y < H; y++) for (let x = x0; x < x1; x++) if (data[(y * W + x) * 4 + 3] > 12) {
    if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  minX = Math.max(x0, minX - PAD); maxX = Math.min(x1 - 1, maxX + PAD); minY = Math.max(0, minY - PAD); maxY = Math.min(H - 1, maxY + PAD);
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const id = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const s = ((y + minY) * W + (x + minX)) * 4, t = (y * w + x) * 4;
    id.data[t] = data[s]; id.data[t + 1] = data[s + 1]; id.data[t + 2] = data[s + 2]; id.data[t + 3] = data[s + 3];
  }
  g.putImageData(id, 0, 0);
  return c;
}

function resize(c) {
  const scale = Math.min(MAX_H / c.height, MAX_W / c.width, 1);
  let cur = c, s = scale;
  if (scale >= 1) return c;
  // 절반씩 줄여 가며 고품질로 축소
  let cw = c.width, ch = c.height;
  const tw = Math.round(c.width * scale), th = Math.round(c.height * scale);
  while (cw / 2 > tw) {
    const n = document.createElement('canvas'); n.width = Math.round(cw / 2); n.height = Math.round(ch / 2);
    const g = n.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(cur, 0, 0, n.width, n.height);
    cur = n; cw = n.width; ch = n.height;
  }
  const n = document.createElement('canvas'); n.width = tw; n.height = th;
  const g = n.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(cur, 0, 0, tw, th);
  return n;
}

(async () => {
  try {
    const img = await load(SRC);
    const { W, H, data } = key(img);
    const sp = findSplit(W, H, data);
    const left = resize(crop(W, H, data, 0, sp.x)), right = resize(crop(W, H, data, sp.x, W));
    window.__out = {
      src: SRC, size: [W, H], split: sp,
      intact: left.toDataURL('image/png'), ruined: right.toDataURL('image/png'),
      intactSize: [left.width, left.height], ruinedSize: [right.width, right.height],
    };
  } catch (e) { window.__out = { error: String(e) }; }
  window.__done = true;
})();
</script>
